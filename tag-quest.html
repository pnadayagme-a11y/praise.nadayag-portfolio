<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tag Quest | Learn HTML</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0f1c;
      --panel: #111827;
      --panel-2: #0d1424;
      --line: #1f2a3d;
      --text: #e5e7eb;
      --muted: #8b98ad;
      --green: #22c55e;
      --cyan: #38bdf8;
      --pink: #f472b6;
      --yellow: #facc15;
      --red: #ef4444;
      --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
      --sans: "Inter", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      overflow-x: hidden;
    }

    /* ---------- Developer background ---------- */
    .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .bg .grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(56,189,248,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56,189,248,0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
    }
    .bg .glow {
      position: absolute; width: 520px; height: 520px; border-radius: 50%;
      filter: blur(120px); opacity: 0.25;
    }
    .bg .glow.g1 { background: var(--green); top: -160px; left: -140px; }
    .bg .glow.g2 { background: var(--cyan); bottom: -180px; right: -140px; }
    .floater {
      position: absolute; bottom: -60px;
      font-family: var(--mono); font-weight: 600;
      white-space: nowrap;
      animation: rise linear infinite;
    }
    @keyframes rise {
      from { transform: translateY(0); }
      to { transform: translateY(-120vh); }
    }
    @media (prefers-reduced-motion: reduce) {
      .floater { animation: none; display: none; }
    }

    /* ---------- Editor window ---------- */
    .window {
      position: relative; z-index: 1;
      width: 100%; max-width: 640px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.55), 0 0 0 1px rgba(34,197,94,0.05);
      overflow: hidden;
    }
    .titlebar {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px;
      background: var(--panel-2);
      border-bottom: 1px solid var(--line);
    }
    .dots { display: flex; gap: 6px; }
    .dots span { width: 12px; height: 12px; border-radius: 50%; }
    .dots span:nth-child(1) { background: #ff5f57; }
    .dots span:nth-child(2) { background: #febc2e; }
    .dots span:nth-child(3) { background: #28c840; }
    .tab {
      font-family: var(--mono); font-size: 12px; color: var(--text);
      background: var(--panel); border: 1px solid var(--line); border-bottom: none;
      padding: 5px 12px; border-radius: 6px 6px 0 0; margin-bottom: -11px;
    }
    .tab::before { content: "◇ "; color: #e34c26; }
    .mode-badge {
      margin-left: auto; font-family: var(--mono); font-size: 11px;
      padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted);
    }
    .mode-badge.easy { color: var(--green); border-color: rgba(34,197,94,0.4); }
    .mode-badge.normal { color: var(--cyan); border-color: rgba(56,189,248,0.4); }
    .mode-badge.hard { color: var(--pink); border-color: rgba(244,114,182,0.4); }
    .content { padding: 28px; }

    /* ---------- Start screen ---------- */
    .logo { font-family: var(--mono); font-size: 34px; font-weight: 800; letter-spacing: -1px; }
    .logo .br { color: var(--cyan); }
    .logo .nm { color: var(--green); }
    .terminal {
      font-family: var(--mono); font-size: 14px; color: var(--muted);
      margin: 10px 0 24px; min-height: 20px;
    }
    .terminal .prompt-sign { color: var(--green); }
    .cursor { display: inline-block; width: 8px; height: 16px; background: var(--green); vertical-align: -2px; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .section-label { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-bottom: 10px; }
    .section-label::before { content: "// "; }
    .modes { display: grid; gap: 10px; }
    .mode-card {
      display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px;
      text-align: left; width: 100%;
      background: var(--panel-2); color: var(--text);
      border: 1px solid var(--line); border-radius: 10px;
      padding: 14px 16px; cursor: pointer; font-family: var(--sans);
      transition: border-color 0.15s, transform 0.15s;
    }
    .mode-card:hover, .mode-card:focus-visible { transform: translateY(-2px); outline: none; }
    .mode-card.easy:hover, .mode-card.easy:focus-visible { border-color: var(--green); }
    .mode-card.normal:hover, .mode-card.normal:focus-visible { border-color: var(--cyan); }
    .mode-card.hard:hover, .mode-card.hard:focus-visible { border-color: var(--pink); }
    .mode-name { font-family: var(--mono); font-weight: 800; font-size: 17px; }
    .mode-card.easy .mode-name { color: var(--green); }
    .mode-card.normal .mode-name { color: var(--cyan); }
    .mode-card.hard .mode-name { color: var(--pink); }
    .mode-desc { grid-column: 1; font-size: 13px; color: var(--muted); }
    .mode-best { grid-row: 1 / span 2; grid-column: 2; font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: right; }
    .mode-best strong { display: block; color: var(--yellow); font-size: 16px; }

    /* ---------- Game screen ---------- */
    .stats {
      display: flex; justify-content: space-between; align-items: center;
      font-family: var(--mono); font-size: 13px; color: var(--muted);
      margin-bottom: 14px;
    }
    .stats strong { color: var(--text); }
    .progress { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; margin-bottom: 20px; }
    .progress > div { height: 100%; background: linear-gradient(90deg, var(--green), var(--cyan)); transition: width 0.3s; }
    .timer { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; margin: -12px 0 20px; display: none; }
    .timer > div { height: 100%; background: var(--pink); width: 100%; }
    .timer.low > div { background: var(--red); }
    .q-title { font-family: var(--mono); font-size: 13px; color: var(--cyan); margin-bottom: 8px; }
    .q-title::before { content: "<!-- "; color: var(--muted); }
    .q-title::after { content: " -->"; color: var(--muted); }
    .q-prompt { font-size: 19px; font-weight: 600; line-height: 1.4; margin-bottom: 20px; }
    .options { display: flex; flex-direction: column; gap: 10px; }
    button.opt {
      background: var(--panel-2); color: var(--text);
      border: 1px solid var(--line);
      padding: 14px 16px; border-radius: 8px; cursor: pointer;
      font-family: var(--mono); font-size: 15px; text-align: left;
      transition: background 0.15s, border-color 0.15s;
    }
    button.opt:not(:disabled):hover { border-color: var(--cyan); background: #142036; }
    button.opt:disabled { cursor: default; opacity: 0.55; }
    button.opt.right { background: #064e3b; border-color: var(--green); opacity: 1; }
    button.opt.picked-wrong { background: #7f1d1d; border-color: var(--red); opacity: 1; }
    button.opt.hidden-opt { visibility: hidden; }
    .type-box { display: flex; gap: 8px; }
    input[type="text"] {
      flex: 1; min-width: 0;
      padding: 12px 14px; border-radius: 8px;
      border: 1px solid var(--line); background: var(--bg);
      color: var(--cyan); font-family: var(--mono); font-size: 16px;
    }
    input[type="text"]:focus { outline: none; border-color: var(--cyan); }
    input[type="text"]:disabled { opacity: 0.6; }
    .btn {
      padding: 12px 18px; border: none; border-radius: 8px;
      font-family: var(--mono); font-weight: 800; font-size: 14px; cursor: pointer;
    }
    .btn:disabled { opacity: 0.45; cursor: default; }
    .btn-cyan { background: var(--cyan); color: var(--bg); }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
    .btn-ghost:not(:disabled):hover { color: var(--text); border-color: var(--muted); }
    .hint-row { margin-top: 12px; }
    .feedback { margin-top: 16px; padding: 12px 14px; border-radius: 8px; display: none; font-size: 15px; line-height: 1.45; }
    .feedback.correct { background: #064e3b; color: #6ee7b7; display: block; }
    .feedback.wrong { background: #7f1d1d; color: #fca5a5; display: block; }
    .next-btn {
      margin-top: 16px; width: 100%; padding: 13px;
      background: var(--green); color: #052e16;
      border: none; border-radius: 8px;
      font-family: var(--mono); font-weight: 800; font-size: 15px;
      cursor: pointer; display: none;
    }
    .next-btn.danger { background: var(--red); color: #fff; }

    /* ---------- End screen ---------- */
    .end-title { font-family: var(--mono); font-size: 26px; font-weight: 800; margin-bottom: 8px; }
    .end-sub { color: var(--muted); margin-bottom: 20px; }
    .end-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
    .end-stat { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; text-align: center; }
    .end-stat span { display: block; font-family: var(--mono); font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    .end-stat strong { font-family: var(--mono); font-size: 20px; }
    .new-best { color: var(--yellow); font-family: var(--mono); font-size: 14px; margin-bottom: 16px; }
    .end-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .end-actions .btn { flex: 1; }

    @media (max-width: 480px) {
      .content { padding: 20px; }
      .logo { font-size: 28px; }
      .q-prompt { font-size: 17px; }
      .end-stat strong { font-size: 17px; }
    }
  </style>
</head>
<body>
  <!-- Animated developer background -->
  <div class="bg" aria-hidden="true">
    <div class="grid"></div>
    <div class="glow g1"></div>
    <div class="glow g2"></div>
    <div id="floaters"></div>
  </div>

  <main class="window">
    <div class="titlebar">
      <div class="dots"><span></span><span></span><span></span></div>
      <div class="tab">tag-quest.html</div>
      <div class="mode-badge" id="mode-badge" hidden></div>
    </div>
    <div class="content" id="app"></div>
  </main>

  <script>
    /* =========================================================
       QUESTION BANK
       level 1 = easy, level 2 = normal, level 3 = hard
       ========================================================= */
    const BANK = [
      // ----- Level 1 (Easy): multiple choice basics -----
      { level: 1, type: "quiz", prompt: "What does HTML stand for?",
        options: ["HyperText Markup Language", "Home Tool Markup Language", "Hyperlinks and Text", "High-Tech Modern Language"], answer: 0,
        explain: "HTML stands for HyperText Markup Language, the backbone of the web." },
      { level: 1, type: "quiz", prompt: "Which tag makes the largest heading?",
        options: ["<h6>", "<head>", "<h1>", "<header>"], answer: 2,
        explain: "<h1> is the biggest and most important heading. <h6> is the smallest." },
      { level: 1, type: "quiz", prompt: "Which tag defines a paragraph?",
        options: ["<para>", "<p>", "<text>", "<paragraph>"], answer: 1,
        explain: "<p> creates a text paragraph." },
      { level: 1, type: "quiz", prompt: "Which tag displays an image?",
        options: ["<picture-file>", "<image>", "<img>", "<src>"], answer: 2,
        explain: "<img> embeds an image into a web page." },
      { level: 1, type: "quiz", prompt: "Which tag creates a link to another page?",
        options: ["<link>", "<a>", "<href>", "<url>"], answer: 1,
        explain: "<a> (anchor) creates a clickable link. <link> connects files like CSS in the <head>." },
      { level: 1, type: "quiz", prompt: "Which tag creates a line break?",
        options: ["<break>", "<lb>", "<br>", "<newline>"], answer: 2,
        explain: "<br> adds a line break and has no closing tag." },
      { level: 1, type: "quiz", prompt: "Which tag makes text bold AND marks it as important?",
        options: ["<b>", "<bold>", "<strong>", "<em>"], answer: 2,
        explain: "<strong> shows importance and appears bold. <b> is bold only, no meaning." },
      { level: 1, type: "quiz", prompt: "Which tag makes a bulleted (unordered) list?",
        options: ["<ol>", "<li>", "<list>", "<ul>"], answer: 3,
        explain: "<ul> makes a bulleted list. <ol> makes a numbered list." },
      { level: 1, type: "quiz", prompt: "Which tag is used for each item inside a list?",
        options: ["<item>", "<li>", "<ul>", "<dot>"], answer: 1,
        explain: "<li> (list item) goes inside <ul> or <ol>." },
      { level: 1, type: "quiz", prompt: "Where does the visible content of a web page go?",
        options: ["<head>", "<body>", "<title>", "<meta>"], answer: 1,
        explain: "Everything users see goes in <body>. <head> holds info about the page." },
      { level: 1, type: "quiz", prompt: "What is the correct way to write an HTML comment?",
        options: ["// comment", "<!-- comment -->", "/* comment */", "# comment"], answer: 1,
        explain: "<!-- --> hides notes in your HTML. Browsers don't show them." },

      // ----- Level 2 (Normal): tags + attributes, some typing -----
      { level: 2, type: "type", prompt: "Type the closing tag for a paragraph:",
        answer: "</p>", explain: "Closing tags have a slash: </p> ends a paragraph." },
      { level: 2, type: "type", prompt: "In <a href=\"page.html\">, which attribute holds the link address? (attribute name only)",
        answer: "href", explain: "href tells the link where to go." },
      { level: 2, type: "type", prompt: "Which tag makes a numbered (ordered) list?",
        answer: "<ol>", explain: "<ol> makes a numbered list. Each item still uses <li>." },
      { level: 2, type: "type", prompt: "Which tag sets the text shown on the browser tab?",
        answer: "<title>", explain: "<title> goes inside <head> and names the browser tab." },
      { level: 2, type: "type", prompt: "In a table, which tag creates a row?",
        answer: "<tr>", explain: "<tr> means table row. Cells go inside it." },
      { level: 2, type: "type", prompt: "Which tag creates a clickable button?",
        answer: "<button>", explain: "<button> makes a clickable button." },
      { level: 2, type: "type", prompt: "In <img src=\"cat.jpg\">, which attribute holds the image file? (attribute name only)",
        answer: "src", explain: "src (source) tells the browser which image file to load." },
      { level: 2, type: "type", prompt: "Which tag makes the smallest heading?",
        answer: "<h6>", explain: "Headings go from <h1> (biggest) to <h6> (smallest)." },
      { level: 2, type: "quiz", prompt: "Which tag creates a text box where users can type?",
        options: ["<input>", "<textbox>", "<type>", "<field>"], answer: 0,
        explain: "<input> creates form fields like text boxes and checkboxes." },
      { level: 2, type: "quiz", prompt: "Which line goes at the very top of every HTML5 page?",
        options: ["<html>", "<head>", "<!DOCTYPE html>", "<start>"], answer: 2,
        explain: "<!DOCTYPE html> tells the browser this is an HTML5 page." },
      { level: 2, type: "quiz", prompt: "Which attribute gives an image alternative text for screen readers?",
        options: ["title", "src", "alt", "text"], answer: 2,
        explain: "alt describes the image for screen readers and shows if the image fails to load." },
      { level: 2, type: "quiz", prompt: "Which tag starts a table?",
        options: ["<table>", "<tab>", "<tr>", "<grid>"], answer: 0,
        explain: "<table> wraps the whole table. <tr> is a row, <td> is a cell." },
      { level: 2, type: "quiz", prompt: "Which tag emphasizes text (usually shown in italics)?",
        options: ["<i>", "<em>", "<italic>", "<strong>"], answer: 1,
        explain: "<em> adds emphasis and appears italic. <i> is italic style only." },

      // ----- Level 3 (Hard): semantic HTML, forms, tables, attributes -----
      { level: 3, type: "type", prompt: "Which attribute makes a link open in a new tab? (attribute name only)",
        answer: "target", accept: ["target=\"_blank\"", "target=_blank", "_blank"],
        explain: "target=\"_blank\" opens the link in a new tab." },
      { level: 3, type: "type", prompt: "Which semantic tag wraps the main navigation links?",
        answer: "<nav>", explain: "<nav> tells browsers and screen readers this is navigation." },
      { level: 3, type: "type", prompt: "Which semantic tag is used for the bottom section of a page?",
        answer: "<footer>", explain: "<footer> holds things like copyright, contact info and links." },
      { level: 3, type: "type", prompt: "Which attribute makes a table cell stretch across 2 columns? (attribute name only)",
        answer: "colspan", explain: "colspan=\"2\" makes a cell span two columns. rowspan does the same for rows." },
      { level: 3, type: "type", prompt: "Which tag creates a dropdown menu in a form?",
        answer: "<select>", explain: "<select> creates a dropdown. Each choice inside is an <option>." },
      { level: 3, type: "type", prompt: "Which tag is used for each choice inside a dropdown?",
        answer: "<option>", explain: "<option> is one choice inside a <select> dropdown." },
      { level: 3, type: "type", prompt: "Which tag gives a form input a clickable text label?",
        answer: "<label>", explain: "<label> names an input and makes it easier to click and to read with screen readers." },
      { level: 3, type: "type", prompt: "On a <label>, which attribute connects it to an input's id? (attribute name only)",
        answer: "for", explain: "<label for=\"email\"> links to <input id=\"email\">." },
      { level: 3, type: "type", prompt: "Which tag embeds another web page (like a YouTube video or Google Map)?",
        answer: "<iframe>", explain: "<iframe> shows another web page inside your page." },
      { level: 3, type: "type", prompt: "In a table, which tag creates a header cell (bold, centered)?",
        answer: "<th>", explain: "<th> is a table header cell. <td> is a normal data cell." },
      { level: 3, type: "type", prompt: "Which semantic tag wraps the main, unique content of a page?",
        answer: "<main>", explain: "<main> holds the page's main content. Use it once per page." },
      { level: 3, type: "quiz", prompt: "Which of these is a void (self-closing) element with no closing tag?",
        options: ["<section>", "<hr>", "<ul>", "<a>"], answer: 1,
        explain: "<hr> (horizontal line) has no closing tag, like <br> and <img>." },
      { level: 3, type: "quiz", prompt: "Which input type hides what the user types?",
        options: ["type=\"hidden\"", "type=\"secret\"", "type=\"password\"", "type=\"private\""], answer: 2,
        explain: "type=\"password\" shows dots instead of letters. type=\"hidden\" hides the whole field." },
      { level: 3, type: "quiz", prompt: "Which is an INLINE container (does not start a new line)?",
        options: ["<div>", "<section>", "<p>", "<span>"], answer: 3,
        explain: "<span> is inline. <div>, <section> and <p> are block elements." },
      { level: 3, type: "quiz", prompt: "Which attribute must be unique, used only once per page?",
        options: ["class", "id", "style", "name"], answer: 1,
        explain: "An id can only be used once per page. A class can be reused many times." },
      { level: 3, type: "quiz", prompt: "Which list is nested correctly?",
        options: ["<li><ul>Item</ul></li>", "<ul>Item</ul>", "<ul><li>Item</li></ul>", "<ul><li>Item</ul></li>"], answer: 2,
        explain: "<li> goes inside <ul>, and tags close in reverse order." },
      { level: 3, type: "quiz", prompt: "What does <meta charset=\"UTF-8\"> do?",
        options: ["Makes the page load faster", "Lets the page show all letters and emojis correctly", "Adds a password", "Sets the font"], answer: 1,
        explain: "UTF-8 lets the browser display every language's letters and emojis correctly." }
    ];

    /* =========================================================
       GAME MODES
       ========================================================= */
    const MODES = {
      easy: {
        label: "Easy", desc: "Multiple choice only. 5 lives. 50/50 hints.",
        mix: { 1: 10 }, quizOnly: true, lives: 5, points: 100, timer: 0, hints: true
      },
      normal: {
        label: "Normal", desc: "Choices + typing tags. 3 lives.",
        mix: { 1: 6, 2: 9 }, quizOnly: false, lives: 3, points: 150, timer: 0, hints: false
      },
      hard: {
        label: "Hard", desc: "Mostly typing. 2 lives. 20s timer per question.",
        mix: { 2: 5, 3: 10 }, quizOnly: false, lives: 2, points: 200, timer: 20, hints: false
      }
    };

    /* =========================================================
       HELPERS
       ========================================================= */
    const $ = id => document.getElementById(id);
    const app = $("app");

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Ignores < > and spaces, so "h1", "<h1>" and "<H1 >" all count
    const clean = s => s.replace(/[<>\s]/g, "").toLowerCase();

    // Best score per mode (saved in this browser only)
    function getBest(mode) {
      try { return Number(localStorage.getItem("tagquest-best-" + mode)) || 0; } catch (e) { return 0; }
    }
    function setBest(mode, value) {
      try { localStorage.setItem("tagquest-best-" + mode, String(value)); } catch (e) {}
    }

    /* =========================================================
       GAME STATE
       ========================================================= */
    let mode, questions, current, score, lives, correctCount;
    let timerId = null, timeLeft = 0;

    /* =========================================================
       START SCREEN
       ========================================================= */
    function showStart() {
      stopTimer();
      const badge = $("mode-badge");
      badge.hidden = true;

      app.innerHTML = `
        <div class="logo"><span class="br">&lt;</span><span class="nm">TagQuest</span><span class="br"> /&gt;</span></div>
        <div class="terminal"><span class="prompt-sign">$</span> <span id="typed"></span><span class="cursor"></span></div>
        <div class="section-label">choose your difficulty</div>
        <div class="modes">
          ${Object.entries(MODES).map(([key, m]) => `
            <button class="mode-card ${key}" data-mode="${key}">
              <span class="mode-name">${m.label}</span>
              <span class="mode-desc">${m.desc}</span>
              <span class="mode-best">best<strong>${getBest(key)}</strong></span>
            </button>`).join("")}
        </div>
      `;
      app.querySelectorAll(".mode-card").forEach(btn => {
        btn.onclick = () => startGame(btn.dataset.mode);
      });
      typeLine("learn HTML one tag at a time");
    }

    // Terminal typing effect
    let typingId = null;
    function typeLine(text) {
      clearInterval(typingId);
      const el = $("typed");
      let i = 0;
      typingId = setInterval(() => {
        if (!el.isConnected) return clearInterval(typingId);
        el.textContent = text.slice(0, ++i);
        if (i >= text.length) clearInterval(typingId);
      }, 55);
    }

    /* =========================================================
       START A GAME
       ========================================================= */
    function startGame(modeKey) {
      mode = modeKey;
      const m = MODES[mode];

      // Build the question list for this mode
      let picked = [];
      for (const [level, count] of Object.entries(m.mix)) {
        let pool = BANK.filter(q => q.level === Number(level));
        if (m.quizOnly) pool = pool.filter(q => q.type === "quiz");
        picked = picked.concat(shuffle(pool.slice()).slice(0, count));
      }
      // Copy so shuffling options never changes the original bank
      questions = shuffle(picked.map(q => JSON.parse(JSON.stringify(q))));
      questions.forEach(q => {
        if (q.type === "quiz") {
          const correctText = q.options[q.answer];
          shuffle(q.options);
          q.answer = q.options.indexOf(correctText);
        }
      });

      current = 0; score = 0; correctCount = 0; lives = m.lives;

      const badge = $("mode-badge");
      badge.hidden = false;
      badge.className = "mode-badge " + mode;
      badge.textContent = m.label.toLowerCase() + " mode";

      app.innerHTML = `
        <div class="stats">
          <span>score: <strong id="score">0</strong></span>
          <span>lives: <strong id="lives"></strong></span>
        </div>
        <div class="progress"><div id="progress-bar"></div></div>
        <div class="timer" id="timer"><div id="timer-bar"></div></div>
        <div class="q-title" id="q-title"></div>
        <p class="q-prompt" id="q-prompt"></p>
        <div id="quiz-area"></div>
        <div class="feedback" id="feedback" role="status"></div>
        <button class="next-btn" id="next-btn">Next Challenge →</button>
      `;
      $("next-btn").onclick = nextQuestion;
      updateHud();
      renderQuestion();
    }

    function updateHud() {
      $("score").textContent = score;
      $("lives").textContent = "❤️".repeat(Math.max(0, lives)) || "💀";
      $("progress-bar").style.width = (current / questions.length * 100) + "%";
    }

    /* =========================================================
       SHOW A QUESTION
       ========================================================= */
    function renderQuestion() {
      const q = questions[current];
      const m = MODES[mode];
      $("q-title").textContent = `challenge ${current + 1} of ${questions.length}`;
      $("q-prompt").textContent = q.prompt;
      $("feedback").className = "feedback";
      $("feedback").textContent = "";
      const nextBtn = $("next-btn");
      nextBtn.style.display = "none";
      nextBtn.className = "next-btn";
      nextBtn.textContent = "Next Challenge →";
      updateHud();

      const area = $("quiz-area");
      area.innerHTML = "";

      if (q.type === "quiz") {
        const div = document.createElement("div");
        div.className = "options";
        q.options.forEach((opt, idx) => {
          const btn = document.createElement("button");
          btn.className = "opt";
          btn.textContent = opt;
          btn.onclick = () => checkAnswer(idx === q.answer, idx);
          div.appendChild(btn);
        });
        area.appendChild(div);

        if (m.hints) {
          const row = document.createElement("div");
          row.className = "hint-row";
          const hintBtn = document.createElement("button");
          hintBtn.className = "btn btn-ghost";
          hintBtn.id = "hint-btn";
          hintBtn.textContent = "💡 50/50 hint";
          hintBtn.onclick = () => useHint(hintBtn);
          row.appendChild(hintBtn);
          area.appendChild(row);
        }
      } else {
        area.innerHTML = `
          <div class="type-box">
            <input type="text" id="userInput" placeholder="Type your answer here" autocomplete="off" autocapitalize="off" spellcheck="false" />
            <button class="btn btn-cyan" id="submit-btn">Submit</button>
          </div>
        `;
        const input = $("userInput");
        $("submit-btn").onclick = checkTyped;
        input.addEventListener("keydown", e => {
          if (e.key === "Enter") {
            e.preventDefault(); // stop this Enter from also clicking "Next"
            checkTyped();
          }
        });
        input.focus();
      }

      startTimer();
    }

    // Easy mode: hide two wrong answers
    function useHint(hintBtn) {
      const q = questions[current];
      const wrong = shuffle([...Array(q.options.length).keys()].filter(i => i !== q.answer)).slice(0, 2);
      const buttons = document.querySelectorAll("button.opt");
      wrong.forEach(i => buttons[i].classList.add("hidden-opt"));
      hintBtn.disabled = true;
    }

    /* =========================================================
       TIMER (Hard mode)
       ========================================================= */
    function startTimer() {
      stopTimer();
      const seconds = MODES[mode].timer;
      const box = $("timer");
      if (!seconds) { box.style.display = "none"; return; }
      box.style.display = "block";
      box.classList.remove("low");
      timeLeft = seconds;
      const bar = $("timer-bar");
      bar.style.transition = "none";
      bar.style.width = "100%";
      timerId = setInterval(() => {
        timeLeft -= 0.1;
        bar.style.width = Math.max(0, timeLeft / seconds * 100) + "%";
        if (timeLeft <= 5) box.classList.add("low");
        if (timeLeft <= 0) {
          stopTimer();
          checkAnswer(false, undefined, true);
        }
      }, 100);
    }
    function stopTimer() {
      clearInterval(timerId);
      timerId = null;
    }

    /* =========================================================
       CHECK ANSWERS
       ========================================================= */
    function checkTyped() {
      const input = $("userInput");
      if (!input || input.disabled) return;
      const value = input.value.trim();
      if (!value) return; // don't punish an empty submit
      const q = questions[current];
      const accepted = [q.answer].concat(q.accept || []).map(clean);
      checkAnswer(accepted.includes(clean(value)));
    }

    function checkAnswer(isCorrect, pickedIdx, timedOut) {
      const q = questions[current];
      const m = MODES[mode];
      const secondsLeft = Math.max(0, Math.ceil(timeLeft));
      stopTimer();

      const fb = $("feedback");
      if (isCorrect) {
        let gained = m.points;
        if (m.timer) gained += secondsLeft * 10; // speed bonus in Hard mode
        score += gained;
        correctCount++;
        fb.className = "feedback correct";
        fb.textContent = `✓ Correct! +${gained}  ${q.explain}`;
      } else {
        lives -= 1;
        fb.className = "feedback wrong";
        const start = timedOut ? "⏰ Time's up!" : "✗ Incorrect!";
        fb.textContent = q.type === "type"
          ? `${start} The answer is ${q.answer}. ${q.explain}`
          : `${start} ${q.explain}`;
      }
      updateHud();

      document.querySelectorAll("button.opt, #submit-btn, #userInput, #hint-btn").forEach(el => el.disabled = true);

      // Show the right answer (and the wrong pick) on multiple choice
      if (q.type === "quiz") {
        const buttons = document.querySelectorAll("button.opt");
        buttons.forEach(b => b.classList.remove("hidden-opt"));
        buttons[q.answer].classList.add("right");
        if (!isCorrect && pickedIdx !== undefined) buttons[pickedIdx].classList.add("picked-wrong");
      }

      const nextBtn = $("next-btn");
      if (lives <= 0) {
        nextBtn.textContent = "See Results";
        nextBtn.classList.add("danger");
      } else if (current === questions.length - 1) {
        nextBtn.textContent = "Finish Quest 🎉";
      }
      nextBtn.style.display = "block";
      // Move focus to Next only after this key press is finished
      setTimeout(() => nextBtn.focus(), 300);
    }

    function nextQuestion() {
      if (lives <= 0) {
        showEnd(false);
        return;
      }
      current++;
      if (current >= questions.length) {
        showEnd(true);
        return;
      }
      renderQuestion();
    }

    /* =========================================================
       END SCREEN
       ========================================================= */
    function showEnd(won) {
      stopTimer();
      const oldBest = getBest(mode);
      const isNewBest = score > oldBest;
      if (isNewBest) setBest(mode, score);

      app.innerHTML = `
        <div class="end-title">${won ? "🎉 Quest complete!" : "💀 Game over"}</div>
        <p class="end-sub">${won
          ? "Great job, you know your tags!"
          : "You ran out of lives. Review the tags and try again!"}</p>
        ${isNewBest ? `<div class="new-best">★ new best score for ${MODES[mode].label} mode!</div>` : ""}
        <div class="end-stats">
          <div class="end-stat"><span>score</span><strong>${score}</strong></div>
          <div class="end-stat"><span>correct</span><strong>${correctCount}/${questions.length}</strong></div>
          <div class="end-stat"><span>best</span><strong>${Math.max(score, oldBest)}</strong></div>
        </div>
        <div class="end-actions">
          <button class="btn btn-cyan" id="again-btn">Play Again</button>
          <button class="btn btn-ghost" id="modes-btn">Change Mode</button>
        </div>
      `;
      $("again-btn").onclick = () => startGame(mode);
      $("modes-btn").onclick = showStart;
    }

    /* =========================================================
       FLOATING CODE BACKGROUND
       ========================================================= */
    (function makeFloaters() {
      const snippets = [
        "<html>", "</div>", "<h1>", "<p>", "<a href>", "<img />", "<ul>", "<li>",
        "<body>", "</section>", "<nav>", "<!DOCTYPE html>", "<button>", "<form>",
        "{ }", "</>", "<table>", "<span>", "<br />", "<footer>", "class=\"\"", "<main>"
      ];
      const colors = ["#22c55e", "#38bdf8", "#f472b6", "#facc15", "#8b98ad"];
      const holder = $("floaters");
      const count = window.innerWidth < 600 ? 12 : 22;
      for (let i = 0; i < count; i++) {
        const el = document.createElement("span");
        el.className = "floater";
        el.textContent = snippets[i % snippets.length];
        el.style.left = (Math.random() * 100) + "vw";
        el.style.fontSize = (11 + Math.random() * 12) + "px";
        el.style.color = colors[Math.floor(Math.random() * colors.length)];
        el.style.opacity = (0.08 + Math.random() * 0.18).toFixed(2);
        const duration = 18 + Math.random() * 22;
        el.style.animationDuration = duration + "s";
        el.style.animationDelay = (-Math.random() * duration) + "s";
        holder.appendChild(el);
      }
    })();

    showStart();
  </script>
</body>
</html>
